<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RefCAD Tool - Kylmähuoneen suunnittelu</title>
    <style>
      body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; margin: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="padding:40px; text-align:center;">
        <h1>Ladataan RefCAD Tool...</h1>
        <p>Jos tämä viesti jää näkyviin, JavaScript ei ole käynnissä.</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="padding:40px;color:#ef4444"><h2>Virhe:</h2><pre>' + (e.message || e) + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="padding:40px;color:#ef4444"><h2>Promise-virhe:</h2><pre>' + (e.reason || e) + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

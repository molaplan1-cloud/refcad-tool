name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Cancel in-progress deploys when new commits arrive (avoid duplicate deploys)
concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # Vercel supports Node 20+ — no version pinning needed for vercel CLI
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Validate package-lock.json is in sync with package.json
        run: |
          echo "Checking that package-lock.json matches package.json..."
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run 'npm install' locally and commit it."
            exit 1
          fi
          npm ci --dry-run --legacy-peer-deps
          if [ $? -ne 0 ]; then
            echo "::error::package-lock.json is out of sync with package.json."
            exit 1
          fi
          echo "Lockfile is in sync ✓"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Vercel CLI deploys with `vercel deploy --prebuilt` after a separate build.
      # We don't actually need to build in CI because the official
      # amondnet/vercel-action handles building + deploying together with full
      # Vercel context (env vars, regions, etc.).
      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./
